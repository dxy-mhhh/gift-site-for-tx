      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0.08 0" result="tinted"/>
    </filter>
    <filter id="softWash" x="-30%" y="-30%" width="160%" height="160%">
