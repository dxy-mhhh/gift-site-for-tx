<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf5e9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="生日礼物">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>给 tx 的生日礼物</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="preloader">
    <div class="loader">
      <svg height="0" width="0" viewBox="0 0 64 64" class="absolute">
        <defs xmlns="http://www.w3.org/2000/svg">
          <linearGradient gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="b">
            <stop stop-color="#973BED"></stop>
            <stop stop-color="#007CFF" offset="1"></stop>
          </linearGradient>
          <linearGradient gradientUnits="userSpaceOnUse" y2="0" x2="0" y1="64" x1="0" id="c">
            <stop stop-color="#FFC800"></stop>
            <stop stop-color="#F0F" offset="1"></stop>
            <animateTransform repeatCount="indefinite" keySplines=".42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1;.42,0,.58,1" keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 0.875; 1" dur="8s" values="0 32 32;-270 32 32;-270 32 32;-540 32 32;-540 32 32;-810 32 32;-810 32 32;-1080 32 32;-1080 32 32" type="rotate" attributeName="gradientTransform"></animateTransform>
          </linearGradient>
          <linearGradient gradientUnits="userSpaceOnUse" y2="2" x2="0" y1="62" x1="0" id="d">
            <stop stop-color="#00E0ED"></stop>
            <stop stop-color="#00DA72" offset="1"></stop>
          </linearGradient>
        </defs>
      </svg>

      <!-- T -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="inline-block">
        <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#b)" d="M 12,8 H 52 M 32,8 V 56" class="dash" id="t" pathLength="360"></path>
      </svg>

      <div class="w-2"></div>

      <!-- X -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64" height="64" width="64" class="inline-block">
        <path stroke-linejoin="round" stroke-linecap="round" stroke-width="8" stroke="url(#c)" d="M 12,12 L 52,52 M 52,12 L 12,52" class="spin" id="x" pathLength="360"></path>
      </svg>
    </div>
    <div class="preloader-text" id="preloader-text">Loading for TX…</div>
  </div>
  <div id="app">
    <div id="bg-decor" aria-hidden="true"></div>
    <div id="bg-anim" aria-hidden="true"></div>

    <section id="scene-cover" class="scene scene-cover active">
      <div class="cover-copy">
        <h1 id="cover-line"></h1>
        <p class="cover-sub" id="cover-sub"></p>
      </div>
      <button id="cover-envelope" class="envelope-shell" type="button" aria-label="打开信封">
        <span class="envelope">
          <span class="env-back"></span>
          <span class="env-letter">给 tx</span>
          <span class="env-front"></span>
          <span class="env-flap"></span>
          <span class="env-stamp">🎀</span>
          <span class="env-label" id="cover-label" aria-hidden="true"></span>
        </span>
        <span class="cover-hint">点一下信封</span>
      </button>
    </section>

    <section id="scene-letter" class="scene scene-letter" aria-live="polite">
      <div id="letter-stage"></div>
    </section>

    <div id="curtain" class="curtain" aria-hidden="true">
      <div class="curtain-bg">
        <div class="curtain-galaxy" id="curtain-galaxy"></div>
        <div class="curtain-rays" id="curtain-rays"></div>
      </div>
      <div class="curtain-inner">
        <div class="curtain-star">⭐</div>
        <h2 id="curtain-title">生日快乐</h2>
        <p id="curtain-sub"></p>
        <p id="curtain-date"></p>
      </div>
    </div>
  </div>

  <audio id="bgm" loop preload="auto">
    <source src="assets/music/birthday-gentle-loop.mp3" type="audio/mpeg">
    <source src="assets/music/birthday-gentle-loop.ogg" type="audio/ogg">
    <source src="assets/music/birthday-gentle-loop.wav" type="audio/wav">
  </audio>

  <script src="libs/gsap.min.js"></script>
  <script src="libs/ScrollTrigger.min.js"></script>
  <script src="libs/SplitText.min.js"></script>
  <script src="libs/hanzi-writer.min.js"></script>
  <script src="libs/canvas-confetti.min.js"></script>
  <script src="js/galaxy.js"></script>
  <script src="js/light-rays.js"></script>
  <script src="js/hanzi-data.js"></script>
  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
